<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Lab</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f0e9; --text: #1d2330; --muted: #6b7280; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121418; --text: #eef0f4; --muted: #9aa3b2; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; align-items: center; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
  .cell h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .frame { position: relative; aspect-ratio: 480 / 264; overflow: hidden; border-radius: 8px; }
  .frame > svg, .frame > canvas, .frame > .egg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frame > canvas { image-rendering: pixelated; }
  .frame > .egg > svg { width: 100%; height: 100%; }
  .guide { position: absolute; left: 0; right: 0; top: 0; height: 56%; border-bottom: 1px dashed rgba(255,255,255,.6); background: rgba(0,0,0,.08); pointer-events: none; display: none; }
  body.guides .guide { display: block; }
</style>
</head>
<body>
<div class="page">
  <h1 style="margin:0 0 12px;font-size:20px">Cabbage Weather · scene lab</h1>
  <div class="controls" id="controls"></div>
  <div class="grid" id="grid"></div>
</div>
<script type="module">
  const bundle = new URLSearchParams(location.search).get('bundle');
  import(bundle ? `./build/scene-lab-${bundle}.js?v=${Date.now()}` : `./build/scene-lab.js?v=${Date.now()}`);
</script>
</body>
</html>
